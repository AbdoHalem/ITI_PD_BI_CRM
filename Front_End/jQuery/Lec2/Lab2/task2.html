<!DOCTYPE html>
<html>
<head>
    <title>Task 2: Plugins</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.cycle2/2.1.6/jquery.cycle2.min.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/elevatezoom/3.0.8/jquery.elevatezoom.min.js"></script>
</head>
<body>

    <h3>1. Image Slideshow (Cycle2)</h3>
    <div class="cycle-slideshow" data-cycle-fx="fade" data-cycle-timeout="2000">
        <img src="1.jpg" alt="Slide 1" width="300">
        <img src="2.jpg" alt="Slide 2" width="300">
        <img src="3.jpg" alt="Slide 3" width="300">
    </div>
    <hr>

    <h3>2. Image Zoom</h3>
    <img id="zoom-img" src="small-img.jpg" data-zoom-image="large-img.jpg" alt="Zoom" width="300">

    <script>
        $(document).ready(function() {
            // Initialize the zoom plugin
            $("#zoom-img").elevateZoom({
                zoomType: "window",
                cursor: "crosshair"
            });
        });
    </script>
</body>
</html>
