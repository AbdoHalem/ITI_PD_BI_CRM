<!DOCTYPE html>
<html>
<head>
    <title>Task 4: Drag & Drop</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>
    
    <style>        
        #drag-me {
            width: 100px;
            height: 120px;
            background-color: yellow;
            text-align: center;
            float: right;
            margin: 100px;
            cursor: pointer;
            padding-top: 10px;
        }
        
        #drag-me img {
            width: 80px;
            height: 80px;
        }
    </style>
</head>
<body>
    <h2>Droppables</h2>
    <hr>
    
    <div id="black-hole">
        <img src="3.JPG" alt="">
    </div>
    
    <div id="drag-me">
        <img src="2.jpg" alt="Rabbit">
        <p>Drag Me</p>
    </div>

    <script>
        $(document).ready(function() {
            // Make the yellow div draggable
            $('#drag-me').draggable();
            
            // Make the black circle a droppable target
            $('#black-hole').droppable({
                drop: function(event, ui) {
                    // When the element is dropped, trigger this function
                    ui.draggable.fadeOut('slow'); // The draggable element disappears
                }
            });
        });
    </script>
</body>
</html>
