<div class="container" style="padding: 20px; max-width: 600px; margin: auto;">
  <h2 style="margin-bottom: 20px;">Add New Student</h2>
  
  <div class="field" style="margin-bottom: 15px;">
    <label style="display: block; font-weight: bold; margin-bottom: 5px;">Name</label>
    <input pInputText [(ngModel)]="newStudent.name" style="width: 100%;" placeholder="Enter student name" />
  </div>

  <div class="field" style="margin-bottom: 25px;">
    <label style="display: block; font-weight: bold; margin-bottom: 5px;">Age</label>
    <input pInputText type="number" [(ngModel)]="newStudent.age" style="width: 100%;" placeholder="Enter student age" />
  </div>

  <div style="display: flex; gap: 10px;">
    <p-button label="Save Student" icon="pi pi-check" severity="success" (onClick)="SaveStudent()"></p-button>
    <p-button label="Cancel" icon="pi pi-times" severity="secondary" (onClick)="GoBack()"></p-button>
  </div>
</div>
