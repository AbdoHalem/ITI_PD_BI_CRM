<div class="container" style="padding: 20px; max-width: 600px; margin: auto;">
  <h2 style="margin-bottom: 20px;">Edit Student Information</h2>

  @if (editForm.id !== 0) {
    <div class="field" style="margin-bottom: 15px;">
      <label style="display: block; font-weight: bold; margin-bottom: 5px;">Name</label>
      <input pInputText [(ngModel)]="editForm.name" style="width: 100%;" />
    </div>

    <div class="field" style="margin-bottom: 25px;">
      <label style="display: block; font-weight: bold; margin-bottom: 5px;">Age</label>
      <input pInputText type="number" [(ngModel)]="editForm.age" style="width: 100%;" />
    </div>

    <div style="display: flex; gap: 10px;">
      <p-button label="Save Changes" icon="pi pi-check" severity="success" (onClick)="SaveUpdates()"></p-button>
      <p-button label="Cancel" icon="pi pi-times" severity="secondary" (onClick)="GoBack()"></p-button>
    </div>
  } @else {
    <div style="text-align: center;">
      <h3 style="color: #dc2626;">Student Not Found!</h3>
      <p-button label="Go Back" icon="pi pi-arrow-left" (onClick)="GoBack()"></p-button>
    </div>
  }
</div>
