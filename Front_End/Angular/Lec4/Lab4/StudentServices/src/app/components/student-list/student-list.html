<div class="container" style="padding: 20px;">
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
    <h2>ITI Students Management</h2>
    <p-button label="Add New Student" icon="pi pi-plus" routerLink="/students/add"></p-button>
  </div>

  <p-table [value]="students()" [tableStyle]="{ 'min-width': '50rem' }" class="shadow-sm">
    <ng-template pTemplate="header">
      <tr>
        <th>Name</th>
        <th style="text-align: center;">Actions</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-s>
      <tr>
        <td>{{ s.name }}</td>
        <td style="text-align: center; display: flex; justify-content: center; gap: 10px;">
          
          <p-button icon="pi pi-eye" severity="info" [text]="true" 
            [routerLink]="['/students/details', s.id]" pTooltip="View Details">
          </p-button>

          <p-button icon="pi pi-pencil" severity="success" [text]="true" 
            [routerLink]="['/students/updates', s.id]" pTooltip="Edit Student">
          </p-button>

          <p-button icon="pi pi-trash" severity="danger" [text]="true" 
            [routerLink]="['/students/delete', s.id]" pTooltip="Delete Student">
          </p-button>

        </td>
      </tr>
    </ng-template>
  </p-table>
</div>
