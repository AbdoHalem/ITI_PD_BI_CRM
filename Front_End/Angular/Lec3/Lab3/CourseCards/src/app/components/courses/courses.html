<div class="container" style="padding: 20px;">
  <h2 style="text-align: center; color: cadetblue; margin-bottom: 20px;">Explore Our Courses</h2>

  <div style="margin-bottom: 30px; text-align: center;">
    <label for="categoryFilter" style="margin-right: 10px; color: #666; font-weight: bold; font-size: 1.2rem;">Filter by Category:</label>
    <select id="categoryFilter" [(ngModel)]="selectedCategory" style="padding: 10px; border-radius: 8px; border: 1px solid #ccc; width: 200px;">
      @for (cat of categoryList; track cat) {
        <option [value]="cat">{{ cat }}</option>
      }
    </select>
  </div>

  <div style="display: flex; flex-wrap: wrap; gap: 20px; justify-content: center;">
    
    @for (course of GetFilteredCourses(); track course.id) {
      
      <p-card 
        [header]="course.title" 
        [subheader]="course.instructor"
        [ngStyle]="{
          'background-color': course.seats === 0 ? '#ffe6e6' : (course.seats <= 2 ? '#fff9c4' : '#ffffff')
        }"
        [ngClass]="{'full-course-text': course.seats === 0}"
        [style]="{ width: '320px', overflow: 'hidden', 'border-radius': '12px' }">
        
        <ng-template pTemplate="header">
          <img [src]="course.image" alt="Course Cover" style="height: 180px; width: 100%; object-fit: cover;" />
        </ng-template>

        <div style="font-size: 1.1rem; line-height: 1.6;">
          <p><strong>Price:</strong> {{ course.price | currency }}</p>
          <p><strong>Seats Available:</strong> {{ course.seats }}</p>
          
          @if (course.seats === 0) {
            <p style="color: red; font-weight: bold; font-size: 1.2rem;">Course Full!</p>
          } @else if (course.seats <= 2) {
            <p style="color: #d97706; font-weight: bold;">Almost Full!</p>
          }
        </div>

        <ng-template pTemplate="footer">
          <p-button 
            label="Register Now" 
            icon="pi pi-check" 
            [disabled]="course.seats === 0"
            (onClick)="RegisterCourse(course)"
            [style]="{'width': '100%'}">
          </p-button>
        </ng-template>

      </p-card>
    }

    @empty {
      <div style="width: 100%; text-align: center; margin-top: 20px;">
        <h4 style="color: #666;">No courses found in this category.</h4>
      </div>
    }

  </div>
</div>
