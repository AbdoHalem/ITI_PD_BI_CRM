<div class="container mt-5">
    <h2 class="mb-4 text-center text-primary">Products</h2>

    <app-product-filter 
        [categories]="categoryList()"
        [totalPrice]="totalFilteredPrice()"
        (categoryChanged)="onFilterChange($event)">
    </app-product-filter>

    <div class="row row-cols-1 row-cols-md-3 g-4">
        @for (product of filteredProducts(); track product.id) {
            <div class="col">
                <div class="card h-100 shadow-sm">
                    <img [src]="product.imageUrl" class="card-img-top p-3" alt="{{ product.name }}" style="height: 250px; object-fit: contain;">
                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title">{{product.name}}</h5>
                        <p class="card-text text-muted">{{product.category}}</p>
                        <h6 class="mt-auto text-success fw-bold">{{product.price | currency}}</h6>
                    </div>
                </div>
            </div>
        }

        @empty {
            <div class="col-12 text-center">
                <p class="alert alert-warning">No products found for this category.</p>
            </div>
        }
    </div>
</div>
