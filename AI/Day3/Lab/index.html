<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITI Gen AI Lab Chatbot</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="d-flex flex-column min-vh-100 bg-light">

    <header class="p-3 bg-dark text-white d-flex justify-content-between align-items-center">
        <h4 class="m-0">AI Assistant</h4>
        <select id="modeSelector" class="form-select w-auto">
            <option value="chat" selected>Chat Mode</option>
            <option value="image">Image Mode</option>
        </select>
    </header>

    <main class="flex-fill container my-4 d-flex flex-column">
        <div class="card flex-fill shadow-sm">
            <div class="card-body overflow-auto" id="chatPane" style="max-height: 70vh;">
                <div class="d-flex justify-content-start mb-3">
                    <div class="bg-primary text-white p-3 rounded">
                        Hello! Choose a mode from the top right and let's start.
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="p-3 bg-white border-top">
        <div class="container">
            <form id="chatForm" class="d-flex gap-2">
                <input type="text" id="promptInput" class="form-control" placeholder="Ask me anything or describe an image..." required autocomplete="off">
                <button type="submit" class="btn btn-dark px-4">Send</button>
            </form>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="config.js"></script>
    <script src="script.js"></script>
</body>
</html>
